[package]
name = "hinterlands-web"
version.workspace = true
edition.workspace = true

[dependencies]
hinterlands-core.workspace = true
hinterlands-mapgen.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence"] }
log = "0.4"
egui = "0.37"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement", "Element", "Url", "Blob", "BlobPropertyBag", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
