[workspace]
resolver = "2"
members = ["crates/hinterlands-core", "crates/hinterlands-mapgen", "crates/hinterlands-cli", "crates/hinterlands-web"]
# The viewer is built for the browser with trunk; plain cargo commands skip it.
default-members = ["crates/hinterlands-core", "crates/hinterlands-mapgen", "crates/hinterlands-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hinterlands-core = { path = "crates/hinterlands-core" }
hinterlands-mapgen = { path = "crates/hinterlands-mapgen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
libm = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
